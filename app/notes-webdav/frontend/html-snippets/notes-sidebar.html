<!-- Notes sidebar — paste inside the main board layout, alongside .board-wrapper -->
<!-- Reference copy: the canonical version lives in app/frontend/index.html -->

<div id="notesSidebar" class="notes-sidebar">
  <div class="notes-sidebar-resizer" id="notesSidebarResizer"></div>
  <div class="notes-sidebar-header">
    <span class="notes-sidebar-label" id="notesSidebarLabel">Notes</span>
    <button class="notes-sidebar-add-btn" id="notesSyncBtn" title="Sync with WebDAV" style="display:none"><span data-icon="sync" data-icon-w="12" data-icon-h="12"></span></button>
    <button class="notes-sidebar-add-btn" id="notesAddFolderBtn" title="Add folder"><span data-icon="folder" data-icon-w="12" data-icon-h="12"></span></button>
    <button class="notes-sidebar-add-btn" id="notesAddRootBtn" title="Add page">+</button>
    <button class="notes-sidebar-add-btn notes-font-btn" id="notesSidebarFontBtn" title="Change font size">A</button>
  </div>
  <div class="notes-tree-body" id="notesTreeBody"></div>
</div>
